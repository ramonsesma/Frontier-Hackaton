  <rect width="1600" height="900" fill="#080808"/>
  <rect x="70" y="55" width="1460" height="2" fill="#aaa2ff"/>
  <rect x="70" y="843" width="1460" height="2" fill="#aaa2ff"/>

  <!-- Recreated Frontier CDMX / 26 mark -->
  <text x="70" y="143" fill="#f5f5f5" font-family="'Courier New', monospace" font-size="57" font-weight="700" letter-spacing="2">FRONTIER.</text>
  <rect x="468" y="96" width="20" height="54" fill="#aaa2ff"/>
  <text x="520" y="136" fill="#bebebe" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" letter-spacing="4">CDMX</text>
  <text x="666" y="136" fill="#888888" font-family="Arial, Helvetica, sans-serif" font-size="28" letter-spacing="4">/ 26</text>

  <!-- Recreated Lab10 mark -->
  <text x="1370" y="142" fill="#f5f5f5" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" letter-spacing="-2">Lab</text>
  <text x="1442" y="142" fill="#f5f5f5" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="800" letter-spacing="-4">10</text>
  <text x="1491" y="122" fill="#d9da00" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800" transform="rotate(42 1491 122)">°</text>
