<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 476" width="1520" height="952" font-family="Helvetica, Arial, sans-serif" font-size="13" role="img" aria-label="El agente es lo único que habla con el modelo y con el escritorio">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8a8a80"/>
    </marker>
  </defs>
  <rect width="760" height="476" fill="#ffffff"/>

  <text x="24" y="28" font-size="15" font-weight="600" fill="#1f1f1c">El agente es lo único que habla con el modelo y con el escritorio</text>

  <!-- Evaluador -->
  <rect x="24" y="56" width="360" height="56" rx="8" fill="none" stroke="#8a8a80" stroke-width="1.25"/>
  <text x="40" y="80" font-weight="600" fill="#1f1f1c">Evaluador</text>
  <text x="40" y="96" font-size="11.5" fill="#5c5c55">POST /tasks y consulta del estado cada 5 s</text>

  <!-- Servicio -->
  <rect x="24" y="136" width="360" height="316" rx="8" fill="none" stroke="#8a8a80" stroke-width="1.25" stroke-dasharray="4 4"/>
  <text x="40" y="158" font-weight="600" fill="#1f1f1c">Servicio desplegado (Docker)</text>

  <!-- server.py -->
  <rect x="40" y="172" width="328" height="72" rx="8" fill="none" stroke="#8a8a80" stroke-width="1.25"/>
  <text x="56" y="196" font-weight="600" fill="#1f1f1c">server.py · API HTTP</text>
  <text x="56" y="212" font-size="11.5" fill="#5c5c55">Valida el token; responde el task_id</text>
  <text x="56" y="228" font-size="11.5" fill="#5c5c55">Lanza la tarea en segundo plano</text>

  <!-- agent.py (destacado) -->
  <rect x="40" y="268" width="328" height="72" rx="8" fill="#e7f1fb" stroke="#2a6fdb" stroke-width="2"/>
  <text x="56" y="292" font-weight="600" fill="#1f1f1c">agent.py · bucle del agente</text>
  <text x="56" y="308" font-size="11.5" fill="#5c5c55">Captura, decide con el modelo y ejecuta</text>
  <text x="56" y="324" font-size="11.5" fill="#5c5c55">Corta a 270 s y borra secretos del resumen</text>

  <!-- rfb.py -->
  <rect x="40" y="364" width="328" height="72" rx="8" fill="none" stroke="#8a8a80" stroke-width="1.25"/>
  <text x="56" y="388" font-weight="600" fill="#1f1f1c">rfb.py · cliente VNC</text>
  <text x="56" y="404" font-size="11.5" fill="#5c5c55">Autentica, captura y envía clics y teclas</text>
  <text x="56" y="420" font-size="11.5" fill="#5c5c55">Espera 1 s a que la pantalla repinte</text>

  <!-- Modelo -->
  <rect x="480" y="268" width="256" height="72" rx="8" fill="none" stroke="#8a8a80" stroke-width="1.25"/>
  <text x="496" y="292" font-weight="600" fill="#1f1f1c">Modelo con visión (API)</text>
  <text x="496" y="308" font-size="11.5" fill="#5c5c55">Lee la captura y elige la acción</text>
  <text x="496" y="324" font-size="11.5" fill="#5c5c55">Cierra con finish: estado y resumen</text>

  <!-- Escritorio -->
  <rect x="480" y="364" width="256" height="72" rx="8" fill="none" stroke="#8a8a80" stroke-width="1.25"/>
  <text x="496" y="388" font-weight="600" fill="#1f1f1c">Escritorio SIGECOM (VNC)</text>
  <text x="496" y="404" font-size="11.5" fill="#5c5c55">Navegador en kiosko de 1280×800</text>
  <text x="496" y="420" font-size="11.5" fill="#5c5c55">Sin API ni red hacia afuera</text>

  <!-- Conexiones -->
  <g fill="none" stroke="#8a8a80" stroke-width="1.25">
    <path d="M330 112V172" marker-end="url(#arrow)"/>
    <path d="M204 244V268" marker-end="url(#arrow)"/>
    <path d="M204 340V364" marker-end="url(#arrow)"/>
    <path d="M368 304H480" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <path d="M368 400H480" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  </g>
  <text x="340" y="130" font-size="11.5" fill="#5c5c55">token Bearer</text>
  <text x="214" y="260" font-size="11.5" fill="#5c5c55">en segundo plano</text>
  <text x="214" y="356" font-size="11.5" fill="#5c5c55">clics, teclas y capturas</text>
  <rect x="376" y="284" width="104" height="16" fill="#ffffff"/>
  <text x="428" y="296" text-anchor="middle" font-size="11.5" fill="#5c5c55">captura y acción</text>
  <rect x="376" y="380" width="104" height="16" fill="#ffffff"/>
  <text x="428" y="392" text-anchor="middle" font-size="11.5" fill="#5c5c55">RFB por websocket</text>
</svg>
