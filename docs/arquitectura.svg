<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1170" viewBox="0 0 1760 1170" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto-start-reverse"><path d="M1,1 L11,6 L1,11 z" fill="#aaa2ff"/></marker></defs>
<rect width="1760" height="1170" fill="#0b0b0d"/>
<rect x="48" y="38" width="10" height="44" fill="#aaa2ff" stroke="#aaa2ff" stroke-width="0"/>
<text x="84" y="76" font-size="40" fill="#f2f2f4" font-weight="700" text-anchor="start">THE AGENT CONNECTS THE MODEL &amp; THE DESKTOP</text>
<line x1="48" y1="98" x2="1712" y2="98" stroke="#2a2550" stroke-width="2"/>
<rect x="48" y="126" width="720" height="112" fill="#141416" stroke="#6b6b72" stroke-width="2"/>
<text x="76" y="172" font-size="30" fill="#f2f2f4" font-weight="700" text-anchor="start">Evaluator</text>
<text x="76" y="208" font-size="22" fill="#c9c9d0" font-weight="400" text-anchor="start">POST /tasks and polls status every 5 s</text>
<polyline points="560,238 560,364" fill="none" stroke="#aaa2ff" stroke-width="2.5"/>
<rect x="572" y="244" width="159" height="34" fill="#0b0b0d"/>
<text x="582" y="268" font-size="21" fill="#aaa2ff" font-weight="400" text-anchor="start">Bearer token</text>
<rect x="48" y="286" width="1000" height="700" fill="none" stroke="#6b6b72" stroke-width="2" stroke-dasharray="8 8"/>
<text x="84" y="338" font-size="30" fill="#f2f2f4" font-weight="700" text-anchor="start">Deployed service (Docker)</text>
<rect x="80" y="364" width="620" height="140" fill="#141416" stroke="#6b6b72" stroke-width="2"/>
<text x="108" y="410" font-size="30" fill="#f2f2f4" font-weight="700" text-anchor="start">server.py · HTTP API</text>
<text x="108" y="446" font-size="22" fill="#c9c9d0" font-weight="400" text-anchor="start">Validates token; returns task_id</text>
<text x="108" y="475" font-size="22" fill="#c9c9d0" font-weight="400" text-anchor="start">Starts the task in the background</text>
<rect x="80" y="560" width="620" height="196" fill="#1b1736" stroke="#aaa2ff" stroke-width="3"/>
<text x="108" y="606" font-size="30" fill="#f2f2f4" font-weight="700" text-anchor="start">agent.py · agent loop</text>
<text x="108" y="642" font-size="22" fill="#c9c9d0" font-weight="400" text-anchor="start">Captures screen, asks model, executes actions</text>
<text x="108" y="671" font-size="22" fill="#c9c9d0" font-weight="400" text-anchor="start">Asks for on-screen evidence before 'terminada'</text>
<text x="108" y="700" font-size="22" fill="#c9c9d0" font-weight="400" text-anchor="start">Stops at 270 s; scrubs secrets from summary</text>
<rect x="80" y="812" width="620" height="140" fill="#141416" stroke="#6b6b72" stroke-width="2"/>
<text x="108" y="858" font-size="30" fill="#f2f2f4" font-weight="700" text-anchor="start">rfb.py · VNC client</text>
<text x="108" y="894" font-size="22" fill="#c9c9d0" font-weight="400" text-anchor="start">Authenticates, captures, sends clicks / keys</text>
<text x="108" y="923" font-size="22" fill="#c9c9d0" font-weight="400" text-anchor="start">Waits 1 s for the screen to redraw</text>
<polyline points="390,504 390,560" fill="none" stroke="#aaa2ff" stroke-width="2.5"/>
<rect x="400" y="516" width="194" height="34" fill="#0b0b0d"/>
<text x="410" y="540" font-size="21" fill="#aaa2ff" font-weight="400" text-anchor="start">background task</text>
<polyline points="390,756 390,812" fill="none" stroke="#aaa2ff" stroke-width="2.5"/>
<rect x="400" y="768" width="322" height="34" fill="#0b0b0d"/>
<text x="410" y="792" font-size="21" fill="#aaa2ff" font-weight="400" text-anchor="start">clicks, keys &amp; screenshots</text>
<rect x="748" y="364" width="268" height="150" fill="#141416" stroke="#6b6b72" stroke-width="2"/>
<text x="776" y="410" font-size="30" fill="#f2f2f4" font-weight="700" text-anchor="start">notes.py</text>
<text x="776" y="446" font-size="22" fill="#c9c9d0" font-weight="400" text-anchor="start">UI hints from earlier</text>
<text x="776" y="475" font-size="22" fill="#c9c9d0" font-weight="400" text-anchor="start">tasks; sanitised, expire</text>
<text x="776" y="504" font-size="22" fill="#c9c9d0" font-weight="400" text-anchor="start">(verify before use)</text>
<polyline points="882,514 882,610 700,610" fill="none" stroke="#aaa2ff" stroke-width="2.5" marker-start="url(#a)" marker-end="url(#a)"/>
<rect x="712" y="550" width="182" height="34" fill="#0b0b0d"/>
<text x="722" y="574" font-size="21" fill="#aaa2ff" font-weight="400" text-anchor="start">hints in / out</text>
<rect x="1290" y="545" width="430" height="170" fill="#141416" stroke="#6b6b72" stroke-width="2"/>
<text x="1318" y="591" font-size="30" fill="#f2f2f4" font-weight="700" text-anchor="start">Vision model (API)</text>
<text x="1318" y="627" font-size="22" fill="#c9c9d0" font-weight="400" text-anchor="start">Reads screenshot; selects an action</text>
<text x="1318" y="656" font-size="22" fill="#c9c9d0" font-weight="400" text-anchor="start">Finishes with status, summary,</text>
<text x="1318" y="685" font-size="22" fill="#c9c9d0" font-weight="400" text-anchor="start">evidence &amp; hints</text>
<polyline points="700,660 1290,660" fill="none" stroke="#aaa2ff" stroke-width="2.5" marker-start="url(#a)" marker-end="url(#a)"/>
<rect x="865" y="626" width="240" height="34" fill="#0b0b0d"/>
<text x="995" y="650" font-size="21" fill="#aaa2ff" font-weight="400" text-anchor="middle">screenshot &amp; action</text>
<rect x="1290" y="812" width="430" height="140" fill="#141416" stroke="#6b6b72" stroke-width="2"/>
<text x="1318" y="858" font-size="30" fill="#f2f2f4" font-weight="700" text-anchor="start">Target desktop (VNC)</text>
<text x="1318" y="894" font-size="22" fill="#c9c9d0" font-weight="400" text-anchor="start">Kiosk browser · 1280×800</text>
<text x="1318" y="923" font-size="22" fill="#c9c9d0" font-weight="400" text-anchor="start">No API; no outbound network</text>
<polyline points="700,882 1290,882" fill="none" stroke="#aaa2ff" stroke-width="2.5" marker-start="url(#a)" marker-end="url(#a)"/>
<rect x="876" y="848" width="217" height="34" fill="#0b0b0d"/>
<text x="995" y="872" font-size="21" fill="#aaa2ff" font-weight="400" text-anchor="middle">RFB via WebSocket</text>
<polyline points="220,986 220,1034" fill="none" stroke="#aaa2ff" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="234" y="994" width="287" height="34" fill="#0b0b0d"/>
<text x="244" y="1018" font-size="21" fill="#aaa2ff" font-weight="400" text-anchor="start">one TRACE line per task</text>
<rect x="48" y="1034" width="1000" height="70" fill="#141416" stroke="#6b6b72" stroke-width="2"/>
<text x="76" y="1080" font-size="30" fill="#f2f2f4" font-weight="700" text-anchor="start">tools/analyze_logs.py</text>
<text x="420" y="1078" font-size="22" fill="#c9c9d0" font-weight="400" text-anchor="start">offline: lists what to review; a person edits the prompt</text>
<text x="48" y="1154" font-size="20" fill="#aaa2ff" font-weight="400" text-anchor="start">FRONTIER HACKATHON · ARCHITECTURE</text>
</svg>